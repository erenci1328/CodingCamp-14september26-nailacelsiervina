<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense & Budget Visualizer</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->
    <nav class="navbar">

        <div class="logo">
            💰 Expense Visualizer
        </div>

        <button
            id="themeBtn"
            class="theme-btn"
            type="button"
        >
            🌙
        </button>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="container">


        <!-- =========================
             TOTAL SPENDING
        ========================== -->
        <section class="balance-card">

            <div>
                <p class="small-title">
                    Total Spending
                </p>

                <h1 id="totalBalance">
                    Rp0
                </h1>

                <p class="description">
                    Your total expenses
                </p>
            </div>

            <div class="money-icon">
                💸
            </div>

        </section>


        <!-- =========================
             ADD TRANSACTION
        ========================== -->
        <section class="card">

            <div class="section-heading">
                <h2>Add Transaction</h2>

                <p>
                    Record your daily spending
                </p>
            </div>


            <form id="transactionForm">

                <!-- ITEM NAME -->
                <div class="form-control">

                    <label for="itemName">
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        placeholder="e.g. Lunch"
                        required
                    >

                </div>


                <!-- AMOUNT -->
                <div class="form-control">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="e.g. 25000"
                        min="1"
                        required
                    >

                </div>


                <!-- CATEGORY -->
                <div class="form-control">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Fun">
                            Fun
                        </option>

                    </select>

                </div>


                <!-- ADD BUTTON -->
                <button
                    class="add-btn"
                    type="submit"
                >
                    + Add Transaction
                </button>

            </form>

        </section>


        <!-- =========================
             BOTTOM CONTENT
        ========================== -->
        <div class="bottom-grid">


            <!-- =========================
                 TRANSACTION LIST
            ========================== -->
            <section class="card">

                <div class="section-header">

                    <div>
                        <h2>Transactions</h2>

                        <p id="transactionCount">
                            0 transactions
                        </p>
                    </div>

                    <button
                        id="sortBtn"
                        class="sort-btn"
                        type="button"
                    >
                        ↕ Sort Amount
                    </button>

                </div>


                <!-- LIST -->
                <div
                    id="transactionList"
                    class="transaction-list"
                ></div>


                <!-- EMPTY STATE -->
                <div
                    id="emptyState"
                    class="empty-state"
                >

                    <div class="empty-icon">
                        🧾
                    </div>

                    <strong>
                        No transactions yet.
                    </strong>

                    <p>
                        Add your first transaction above.
                    </p>

                </div>

            </section>


            <!-- =========================
                 CHART
            ========================== -->
            <section class="card chart-card">

                <div class="section-heading">

                    <h2>
                        Spending by Category
                    </h2>

                    <p>
                        See where your money goes
                    </p>

                </div>


                <div class="chart-box">

                    <canvas
                        id="categoryChart"
                    ></canvas>

                </div>


                <!-- CHART LEGEND -->
                <div class="legend">

                    <div>
                        <span class="dot food"></span>
                        Food
                    </div>

                    <div>
                        <span class="dot transport"></span>
                        Transport
                    </div>

                    <div>
                        <span class="dot fun"></span>
                        Fun
                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
  </html>
